name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Unpack source
        run: |
          if [ -f focusguard.zip ]; then unzip -oq focusguard.zip; fi
          ls app
      - name: Create Android project and add source
        run: |
          flutter create --org com.focusguard --project-name focusguard --platforms=android build_app
          rm -rf build_app/lib build_app/test
          cp -r app/lib build_app/lib
          cp app/pubspec.yaml build_app/pubspec.yaml
          mkdir -p build_app/android/app/src/main/kotlin/com/focusguard/focusguard
          cp app/MainActivity.kt build_app/android/app/src/main/kotlin/com/focusguard/focusguard/MainActivity.kt
          sed -i 's/android:label="[^"]*"/android:label="Pulse Pond"/' build_app/android/app/src/main/AndroidManifest.xml
      - name: Build release APKs
        working-directory: build_app
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: PulsePond-apk
          path: build_app/build/app/outputs/flutter-apk/*.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: build_app/build/app/outputs/flutter-apk/*.apk
